<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>어둠의 성소 · 모바일 소원 노트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #08060b 0%, #010001 100%);
            font-family: 'Pretendard', -apple-system, 'Segoe UI', 'Nanum Gothic', 'Malgun Gothic', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        /* 앱 래퍼 - 모바일 최적화 */
        .app-wrapper {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        /* 공통 카드 스타일 (다크 판타지) */
        .glass-card {
            background: rgba(6, 4, 12, 0.94);
            backdrop-filter: blur(8px);
            border-radius: 1.8rem;
            border: 1px solid #342c4e;
            box-shadow: 0 20px 35px -12px black, 0 0 0 1px #2f274a;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        /* 로그인/회원가입 폼 */
        .auth-container {
            padding: 1.8rem 1.5rem;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .auth-header h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #cbadff, #9e6ee2);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .auth-header p {
            color: #a28ad6;
            font-size: 0.75rem;
            margin-top: 6px;
        }

        .input-field {
            margin-bottom: 1rem;
        }

        .input-field label {
            display: block;
            font-size: 0.7rem;
            font-weight: 500;
            margin-bottom: 5px;
            margin-left: 12px;
            color: #bba5ec;
        }

        .input-field input {
            width: 100%;
            background: #0b0717;
            border: 1px solid #3d3068;
            padding: 12px 16px;
            border-radius: 32px;
            font-size: 0.9rem;
            color: #f2eaff;
            transition: 0.2s;
            font-family: inherit;
            -webkit-appearance: none;
        }

        .input-field input:focus {
            outline: none;
            border-color: #bc93ff;
            box-shadow: 0 0 0 2px rgba(156, 107, 255, 0.4);
            background: #100b1f;
        }

        .btn-auth {
            background: linear-gradient(95deg, #391e6b, #1f0e46);
            border: none;
            color: #e9dcff;
            font-weight: bold;
            font-size: 0.95rem;
            padding: 12px;
            border-radius: 40px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            margin-top: 8px;
            font-family: inherit;
        }

        .btn-auth:hover {
            background: linear-gradient(95deg, #5733a3, #2d1a60);
            transform: translateY(-1px);
        }

        .switch-text {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.75rem;
            color: #9d89cf;
        }

        .switch-link {
            color: #d1b9ff;
            cursor: pointer;
            font-weight: bold;
            text-decoration: underline;
            background: none;
            border: none;
            font-size: 0.75rem;
        }

        .error-msg {
            color: #ff9a8b;
            font-size: 0.7rem;
            margin-top: 8px;
            text-align: center;
        }

        /* 메인 포럼 (개인 공간) - 모바일 친화적 */
        .forum-main {
            display: none;
        }

        .forum-container {
            background: rgba(6, 4, 12, 0.92);
            backdrop-filter: blur(4px);
            border-radius: 1.8rem;
            box-shadow: 0 20px 35px -12px black, 0 0 0 1px #342c4e;
            overflow: hidden;
        }

        .forum-header {
            background: rgba(3, 1, 10, 0.96);
            padding: 1.2rem 1rem;
            text-align: center;
            border-bottom: 2px solid #3f2b6b;
        }

        .forum-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #cbadff, #9e6ee2);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .user-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f0b1d;
            padding: 0.7rem 1rem;
            border-bottom: 1px solid #2e274b;
            flex-wrap: wrap;
            gap: 8px;
        }

        .welcome-text {
            font-size: 0.8rem;
            color: #cbb9ff;
            word-break: keep-all;
        }

        .logout-btn {
            background: #211c3a;
            border: 0.5px solid #6550a3;
            padding: 5px 14px;
            border-radius: 40px;
            color: #e0ceff;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.1s;
        }

        .rules-panel {
            background: #06030dd9;
            margin: 1rem 1rem 0 1rem;
            padding: 0.9rem 1rem;
            border-radius: 1.3rem;
            border-left: 4px solid #aa6ef0;
        }

        .rules-title {
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 6px;
            color: #e1c8ff;
        }

        .rules-list {
            list-style: none;
            padding-left: 4px;
        }

        .rules-list li {
            margin-bottom: 5px;
            font-size: 0.7rem;
            color: #cabef0;
            display: flex;
            gap: 6px;
            align-items: baseline;
        }

        .rules-list li::before {
            content: "⚠️";
            font-size: 0.65rem;
        }

        .wish-form {
            background: rgba(8, 6, 18, 0.7);
            margin: 1rem 1rem 0.6rem 1rem;
            padding: 1rem 1.2rem;
            border-radius: 1.4rem;
            backdrop-filter: blur(4px);
            border: 1px solid #322b4b;
        }

        .form-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.9rem;
            color: #c5aeff;
            border-left: 3px solid #795ae6;
            padding-left: 12px;
        }

        input, textarea {
            width: 100%;
            background: #0b0717;
            border: 1px solid #3d3068;
            padding: 10px 14px;
            border-radius: 28px;
            font-size: 0.85rem;
            font-family: inherit;
            color: #f2eaff;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .input-group {
            margin-bottom: 0.9rem;
        }

        .input-group label {
            font-size: 0.7rem;
            margin-left: 12px;
            color: #bba5ec;
            display: block;
            margin-bottom: 4px;
        }

        .char-counter {
            text-align: right;
            font-size: 0.6rem;
            color: #8b78b5;
            margin-top: 4px;
            margin-right: 10px;
        }

        .btn-submit {
            background: linear-gradient(95deg, #391e6b, #1f0e46);
            border: none;
            color: #e9dcff;
            font-weight: bold;
            padding: 10px;
            border-radius: 40px;
            cursor: pointer;
            width: 100%;
            margin-top: 4px;
            font-size: 0.9rem;
        }

        .wishes-section {
            padding: 0.8rem 1rem 1.5rem 1rem;
        }

        .wishes-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.9rem;
            border-left: 4px solid #856be0;
            padding-left: 12px;
            flex-wrap: wrap;
            gap: 5px;
        }

        .wishes-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #cdb7ff;
        }

        .wish-count {
            background: #1b152f;
            border-radius: 60px;
            padding: 3px 12px;
            font-size: 0.65rem;
            border: 0.5px solid #5e4c92;
        }

        .wishes-list {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            max-height: 480px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .wish-card {
            background: rgba(15, 12, 27, 0.85);
            border-radius: 1.3rem;
            padding: 0.9rem 1rem;
            border: 1px solid #342d55;
            transition: 0.1s;
        }

        .wish-meta {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 8px;
            gap: 5px;
        }

        .wish-nickname {
            font-size: 0.8rem;
            background: #201b3c;
            padding: 2px 12px;
            border-radius: 40px;
            color: #d9c7ff;
            word-break: break-word;
        }

        .wish-time {
            font-size: 0.55rem;
            color: #9b89bf;
        }

        .wish-content {
            font-size: 0.85rem;
            background: #01000b4d;
            padding: 8px 12px;
            border-radius: 18px;
            margin: 6px 0;
            word-break: break-word;
            line-height: 1.4;
        }

        .expiry-tag {
            font-size: 0.55rem;
            color: #ff9a8b;
            background: #2a1f3a;
            padding: 2px 8px;
            border-radius: 30px;
            display: inline-block;
        }

        .wish-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.7rem;
            margin-top: 8px;
        }

        .like-btn, .delete-btn {
            background: #1c1733;
            border: 0.5px solid #5c489b;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.65rem;
            cursor: pointer;
            color: #cdbbff;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .empty-wishes {
            text-align: center;
            padding: 1.8rem;
            background: #0a071bd9;
            border-radius: 1.5rem;
            color: #b69ef0;
            font-size: 0.8rem;
        }

        footer {
            font-size: 0.55rem;
            text-align: center;
            padding: 0.8rem;
            color: #5f5390;
            border-top: 1px solid #262043;
        }

        /* 스크롤 최적화 */
        .wishes-list::-webkit-scrollbar {
            width: 3px;
        }
        .wishes-list::-webkit-scrollbar-track {
            background: #120f23;
            border-radius: 10px;
        }
        .wishes-list::-webkit-scrollbar-thumb {
            background: #6f57be;
        }

        /* 모바일 터치 버튼 활성화 */
        button {
            cursor: pointer;
            touch-action: manipulation;
        }

        /* 작은 화면 여유 */
        @media (max-width: 480px) {
            body {
                padding: 8px;
            }
            .auth-container {
                padding: 1.5rem 1.2rem;
            }
            .forum-header h1 {
                font-size: 1.3rem;
            }
            .wish-form {
                margin: 0.8rem 0.8rem 0.6rem 0.8rem;
                padding: 0.9rem 1rem;
            }
            .wishes-section {
                padding: 0.5rem 0.8rem 1.2rem 0.8rem;
            }
            .rules-panel {
                margin: 0.8rem 0.8rem 0 0.8rem;
            }
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <!-- 로그인/회원가입 패널 (모바일 반응형) -->
    <div id="authPanel" class="glass-card auth-container">
        <div class="auth-header">
            <h1>🌑 그림자 성소</h1>
            <p>혼자만의 소원을 간직하는 곳</p>
        </div>
        <div id="loginForm">
            <div class="input-field">
                <label>🕯️ 아이디</label>
                <input type="text" id="loginId" placeholder="사용자 이름" autocomplete="username">
            </div>
            <div class="input-field">
                <label>🔒 비밀번호</label>
                <input type="password" id="loginPw" placeholder="********" autocomplete="current-password">
            </div>
            <button class="btn-auth" id="doLoginBtn">✦ 로그인 ✦</button>
            <div class="switch-text">
                계정이 없으신가요? <button class="switch-link" id="showRegisterBtn">회원가입</button>
            </div>
            <div id="loginError" class="error-msg"></div>
        </div>

        <div id="registerForm" style="display:none;">
            <div class="input-field">
                <label>✨ 아이디 (3~20자)</label>
                <input type="text" id="regId" placeholder="원하는 아이디">
            </div>
            <div class="input-field">
                <label>🔮 비밀번호 (4자 이상)</label>
                <input type="password" id="regPw" placeholder="비밀번호">
            </div>
            <div class="input-field">
                <label>🌸 닉네임 (표시 이름)</label>
                <input type="text" id="regNick" placeholder="소원을 쓸 닉네임">
            </div>
            <button class="btn-auth" id="doRegisterBtn">🌙 회원가입 🌙</button>
            <div class="switch-text">
                이미 계정이 있으신가요? <button class="switch-link" id="showLoginBtn">로그인</button>
            </div>
            <div id="regError" class="error-msg"></div>
        </div>
    </div>

    <!-- 메인 포럼 (개인 공간, 타인 소원 보이지 않음) -->
    <div id="forumPanel" class="forum-main">
        <div class="forum-container">
            <div class="forum-header">
                <h1>🕯️ 나만의 소원 노트</h1>
            </div>
            <div class="user-info-bar">
                <span class="welcome-text" id="welcomeUserSpan">🌒 어서오세요</span>
                <button class="logout-btn" id="logoutBtn">👤 로그아웃</button>
            </div>
            <div class="rules-panel">
                <div class="rules-title">📜 성소 규칙</div>
                <ul class="rules-list">
                    <li>실현된 소원은 24시간 이내에 사라진다.</li>
                    <li>인간의 죽음을 바라는 소원은 빌 수 없다. 위반 시 처벌.</li>
                    <li>당신의 소원은 오직 당신만 볼 수 있습니다. (완전한 프라이버시)</li>
                </ul>
            </div>

            <div class="wish-form">
                <div class="form-title">✍️ 소원을 새기다</div>
                <div class="input-group">
                    <label>🌟 내 닉네임</label>
                    <input type="text" id="forumNickname" placeholder="표시될 이름" maxlength="20">
                </div>
                <div class="input-group">
                    <label>💫 소원 내용 (죽음 관련 금지)</label>
                    <textarea id="wishText" rows="3" placeholder="간절한 바람을 적어보세요... (최대 200자)" maxlength="200"></textarea>
                    <div class="char-counter"><span id="charCount">0</span> / 200</div>
                </div>
                <button class="btn-submit" id="submitWishBtn">⭐ 소원 빌기 ⭐</button>
            </div>

            <div class="wishes-section">
                <div class="wishes-header">
                    <h2>🌒 내가 쓴 소원들</h2>
                    <div class="wish-count" id="wishCountDisplay">0개의 소원</div>
                </div>
                <div class="wishes-list" id="wishesListContainer">
                    <div class="empty-wishes">🌑 아직 소원이 없습니다. 첫 번째 소원을 남겨보세요.</div>
                </div>
            </div>
            <footer>⚠️ 타인의 소원은 보이지 않습니다. 오직 당신의 소원만 간직됩니다.</footer>
        </div>
    </div>
</div>

<script>
    // ---------- 사용자 데이터 & 개인 소원 데이터 (localStorage 격리) ----------
    let users = [];
    let currentUserId = null;

    function getUserWishesKey(userId) {
        return `private_wishes_${userId}`;
    }

    function loadUsers() {
        const storedUsers = localStorage.getItem('dark_wish_users_mobile');
        if (storedUsers) {
            try {
                users = JSON.parse(storedUsers);
            } catch(e) { users = []; }
        }
        if (!users.length) {
            users = [
                { userId: "dreamer", password: "1111", nickname: "별빛방랑자" },
                { userId: "shadow", password: "2222", nickname: "그림자수집가" }
            ];
            saveUsers();
        }
    }

    function saveUsers() {
        localStorage.setItem('dark_wish_users_mobile', JSON.stringify(users));
    }

    // 개인 소원 목록 (격리)
    function getUserWishes(userId) {
        const key = getUserWishesKey(userId);
        const stored = localStorage.getItem(key);
        if (stored) {
            try {
                let arr = JSON.parse(stored);
                if (Array.isArray(arr)) return arr;
            } catch(e) {}
        }
        // 개인 샘플 소원 (첫 로그인시 부드러운 경험)
        return [
            {
                id: "sample_m_1",
                nickname: "초기 기록자",
                content: "이곳은 나만의 소원 공간입니다. 타인에게 보이지 않아요.",
                createTime: new Date(Date.now() - 3600000).toISOString(),
                likes: 3
            },
            {
                id: "sample_m_2",
                nickname: "어둠의 메신저",
                content: "반드시 장학금을 받아야 해.",
                createTime: new Date(Date.now() - 7200000).toISOString(),
                likes: 7
            }
        ];
    }

    function saveUserWishes(userId, wishesArray) {
        const key = getUserWishesKey(userId);
        localStorage.setItem(key, JSON.stringify(wishesArray));
    }

    // 죽음 관련 필터
    function containsDeathWish(content) {
        const deathKeywords = ['죽음', '죽다', '죽어라', '죽기를', '사망', '살해', '죽여', '죽었으면', '자살', '죽게 해주세요', 'die', 'kill', '암살'];
        const lower = content.toLowerCase();
        return deathKeywords.some(kw => lower.includes(kw));
    }

    function validateNoDeath(content) {
        if (containsDeathWish(content)) {
            alert("❌ 금지된 소원: 인간의 죽음을 바라는 소원은 빌 수 없습니다. 규칙 위반 시 처벌 대상입니다.");
            return false;
        }
        return true;
    }

    // 24시간 만료 필터
    function filterExpiredWishes(wishes) {
        const now = Date.now();
        const TWENTY_FOUR = 24 * 3600000;
        return wishes.filter(w => (now - new Date(w.createTime).getTime()) < TWENTY_FOUR);
    }

    // 소원 추가
    function addWishForCurrentUser(nickname, content) {
        if (!currentUserId) return false;
        if (!content.trim()) {
            alert("소원 내용을 입력해주세요.");
            return false;
        }
        if (content.length > 200) {
            alert("200자 이내로 작성해주세요.");
            return false;
        }
        if (!validateNoDeath(content)) return false;

        let finalNick = nickname.trim();
        if (finalNick === "") finalNick = "익명의 나그네";
        if (finalNick.length > 20) finalNick = finalNick.substring(0,18)+"..";

        const newWish = {
            id: Date.now().toString(36) + Math.random().toString(36).substring(2,6),
            nickname: finalNick,
            content: content.trim(),
            createTime: new Date().toISOString(),
            likes: 0,
        };

        let userWishes = getUserWishes(currentUserId);
        userWishes.unshift(newWish);
        userWishes = filterExpiredWishes(userWishes);
        saveUserWishes(currentUserId, userWishes);
        renderPrivateWishes();
        return true;
    }

    function deleteWishById(wishId) {
        if (!currentUserId) return;
        let wishes = getUserWishes(currentUserId);
        const target = wishes.find(w => w.id === wishId);
        if (!target) return;
        if (confirm(`"${target.content.substring(0,40)}" 소원을 삭제하시겠습니까?`)) {
            wishes = wishes.filter(w => w.id !== wishId);
            saveUserWishes(currentUserId, wishes);
            renderPrivateWishes();
        }
    }

    function likeWishById(wishId) {
        if (!currentUserId) return;
        let wishes = getUserWishes(currentUserId);
        const idx = wishes.findIndex(w => w.id === wishId);
        if (idx !== -1) {
            wishes[idx].likes += 1;
            saveUserWishes(currentUserId, wishes);
            renderPrivateWishes();
        }
    }

    // 시간 유틸
    function formatRelative(isoDate) {
        if (!isoDate) return "";
        const date = new Date(isoDate);
        const diff = Date.now() - date;
        const mins = Math.floor(diff / 60000);
        if (mins < 1) return "방금 전";
        if (mins < 60) return `${mins}분 전`;
        const hours = Math.floor(mins / 60);
        if (hours < 24) return `${hours}시간 전`;
        const days = Math.floor(hours / 24);
        return `${days}일 전`;
    }

    function getRemaining(createIso) {
        const expire = new Date(createIso).getTime() + 86400000;
        const left = expire - Date.now();
        if (left <= 0) return "0분";
        const hours = Math.floor(left / 3600000);
        const minutes = Math.floor((left % 3600000) / 60000);
        return `${hours}시간 ${minutes}분`;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    // 개인 소원 렌더링 (완전 격리)
    function renderPrivateWishes() {
        if (!currentUserId) return;
        let wishes = getUserWishes(currentUserId);
        const now = Date.now();
        const TWENTY_FOUR = 86400000;
        let changed = false;
        const filtered = wishes.filter(w => {
            if (now - new Date(w.createTime).getTime() >= TWENTY_FOUR) {
                changed = true;
                return false;
            }
            return true;
        });
        if (changed) {
            saveUserWishes(currentUserId, filtered);
            wishes = filtered;
        }

        const container = document.getElementById('wishesListContainer');
        const countSpan = document.getElementById('wishCountDisplay');
        if (!container) return;

        if (!wishes.length) {
            container.innerHTML = `<div class="empty-wishes">🌑 아직 소원이 없습니다. 첫 번째 소원을 남겨보세요.</div>`;
            if(countSpan) countSpan.innerText = `0개의 소원`;
            return;
        }

        countSpan.innerText = `${wishes.length}개의 소원`;
        let html = '';
        for (let w of wishes) {
            const remainStr = getRemaining(w.createTime);
            const timeStr = formatRelative(w.createTime);
            const safeNick = escapeHtml(w.nickname);
            const safeCont = escapeHtml(w.content);
            html += `
                <div class="wish-card">
                    <div class="wish-meta">
                        <span class="wish-nickname">${safeNick}</span>
                        <span class="wish-time">${timeStr}</span>
                    </div>
                    <div class="wish-content">🌙 ${safeCont}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
                        <span class="expiry-tag">🕯️ 잔여 ${remainStr}</span>
                        <div class="wish-actions">
                            <button class="like-btn" data-id="${w.id}">💜 ${w.likes} 공감</button>
                            <button class="delete-btn" data-id="${w.id}">🗑️ 삭제</button>
                        </div>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;

        // 모바일 이벤트 재바인딩
        document.querySelectorAll('.like-btn').forEach(btn => {
            btn.removeEventListener('click', likeHandler);
            btn.addEventListener('click', likeHandler);
        });
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.removeEventListener('click', deleteHandler);
            btn.addEventListener('click', deleteHandler);
        });
    }

    function likeHandler(e) {
        const btn = e.currentTarget;
        const id = btn.getAttribute('data-id');
        if (id) likeWishById(id);
    }
    function deleteHandler(e) {
        const btn = e.currentTarget;
        const id = btn.getAttribute('data-id');
        if (id) deleteWishById(id);
    }

    let expiryInterval = null;
    function startExpiryWatcher() {
        if (expiryInterval) clearInterval(expiryInterval);
        expiryInterval = setInterval(() => {
            if (currentUserId) {
                let wishes = getUserWishes(currentUserId);
                const newWishes = filterExpiredWishes(wishes);
                if (newWishes.length !== wishes.length) {
                    saveUserWishes(currentUserId, newWishes);
                    renderPrivateWishes();
                } else {
                    renderPrivateWishes(); // 타이머 텍스트 갱신
                }
            }
        }, 60000);
    }

    // 로그인/로그아웃
    function doLogin(userId, password) {
        const user = users.find(u => u.userId === userId && u.password === password);
        if (user) {
            currentUserId = user.userId;
            localStorage.setItem('currentSessionUserId_mobile', currentUserId);
            document.getElementById('authPanel').style.display = 'none';
            document.getElementById('forumPanel').style.display = 'block';
            const nicknameInput = document.getElementById('forumNickname');
            if (nicknameInput) nicknameInput.value = user.nickname;
            document.getElementById('welcomeUserSpan').innerHTML = `🌒 ${escapeHtml(user.nickname)} 님, 당신만의 공간`;
            renderPrivateWishes();
            startExpiryWatcher();
            return true;
        } else {
            document.getElementById('loginError').innerText = "아이디 또는 비밀번호가 일치하지 않습니다.";
            return false;
        }
    }

    function doRegister(uid, pw, nick) {
        if (!uid || uid.length < 3 || uid.length > 20) {
            document.getElementById('regError').innerText = "아이디는 3~20자여야 합니다.";
            return false;
        }
        if (!pw || pw.length < 4) {
            document.getElementById('regError').innerText = "비밀번호는 4자 이상 입력하세요.";
            return false;
        }
        if (!nick || nick.trim() === "") {
            document.getElementById('regError').innerText = "닉네임을 입력해주세요.";
            return false;
        }
        if (users.some(u => u.userId === uid)) {
            document.getElementById('regError').innerText = "이미 존재하는 아이디입니다.";
            return false;
        }
        const newUser = { userId: uid, password: pw, nickname: nick.trim() };
        users.push(newUser);
        saveUsers();
        saveUserWishes(uid, []);
        alert("회원가입 성공! 로그인해주세요.");
        toggleAuthForms('login');
        return true;
    }

    function logout() {
        currentUserId = null;
        localStorage.removeItem('currentSessionUserId_mobile');
        document.getElementById('forumPanel').style.display = 'none';
        document.getElementById('authPanel').style.display = 'block';
        if (expiryInterval) clearInterval(expiryInterval);
        document.getElementById('loginId').value = '';
        document.getElementById('loginPw').value = '';
        document.getElementById('loginError').innerText = '';
    }

    function toggleAuthForms(formType) {
        const loginDiv = document.getElementById('loginForm');
        const regDiv = document.getElementById('registerForm');
        if (formType === 'register') {
            loginDiv.style.display = 'none';
            regDiv.style.display = 'block';
            document.getElementById('regError').innerText = '';
        } else {
            loginDiv.style.display = 'block';
            regDiv.style.display = 'none';
            document.getElementById('loginError').innerText = '';
        }
    }

    function updateCharCount() {
        const ta = document.getElementById('wishText');
        const span = document.getElementById('charCount');
        if (ta && span) span.innerText = ta.value.length;
    }

    function checkAutoLogin() {
        const saved = localStorage.getItem('currentSessionUserId_mobile');
        if (saved) {
            const userExists = users.find(u => u.userId === saved);
            if (userExists) {
                doLogin(userExists.userId, userExists.password);
            } else {
                localStorage.removeItem('currentSessionUserId_mobile');
            }
        }
    }

    function initEventListeners() {
        document.getElementById('doLoginBtn').addEventListener('click', () => {
            const id = document.getElementById('loginId').value;
            const pw = document.getElementById('loginPw').value;
            doLogin(id, pw);
        });
        document.getElementById('doRegisterBtn').addEventListener('click', () => {
            const id = document.getElementById('regId').value;
            const pw = document.getElementById('regPw').value;
            const nick = document.getElementById('regNick').value;
            doRegister(id, pw, nick);
        });
        document.getElementById('showRegisterBtn').addEventListener('click', () => toggleAuthForms('register'));
        document.getElementById('showLoginBtn').addEventListener('click', () => toggleAuthForms('login'));
        document.getElementById('logoutBtn').addEventListener('click', () => logout());
        document.getElementById('submitWishBtn').addEventListener('click', () => {
            const nicknameVal = document.getElementById('forumNickname').value;
            const wishContent = document.getElementById('wishText').value;
            if (addWishForCurrentUser(nicknameVal, wishContent)) {
                document.getElementById('wishText').value = '';
                updateCharCount();
            }
        });
        const textarea = document.getElementById('wishText');
        if (textarea) {
            textarea.addEventListener('input', updateCharCount);
            textarea.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    document.getElementById('submitWishBtn').click();
                }
            });
        }
        updateCharCount();
    }

    loadUsers();
    initEventListeners();
    checkAutoLogin();
</script>
</body>
</html>
